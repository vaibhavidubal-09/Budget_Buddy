services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: budgetbuddy
      MYSQL_USER: budgetbuddy
      MYSQL_PASSWORD: ${BUDGETBUDDY_DB_PASSWORD:?Set BUDGETBUDDY_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - budgetbuddy-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      BUDGETBUDDY_DB_URL: jdbc:mysql://mysql:3306/budgetbuddy
      BUDGETBUDDY_DB_USERNAME: budgetbuddy
      BUDGETBUDDY_DB_PASSWORD: ${BUDGETBUDDY_DB_PASSWORD:?Set BUDGETBUDDY_DB_PASSWORD in .env}
      BUDGETBUDDY_JWT_SECRET: ${BUDGETBUDDY_JWT_SECRET:?Set BUDGETBUDDY_JWT_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BUDGETBUDDY_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  budgetbuddy-db:
