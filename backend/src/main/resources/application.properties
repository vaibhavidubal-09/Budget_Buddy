server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.datasource.url=${BUDGETBUDDY_DB_URL:jdbc:mysql://localhost:3306/budgetbuddy}
spring.datasource.username=${BUDGETBUDDY_DB_USERNAME:root}
spring.datasource.password=${BUDGETBUDDY_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=${BUDGETBUDDY_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
budgetbuddy.jwt.secret=${BUDGETBUDDY_JWT_SECRET}
budgetbuddy.gemini.api-key=${GEMINI_API_KEY:}
budgetbuddy.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
budgetbuddy.time-zone=Asia/Kolkata
